services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-hello-app
    env_file:
      - .env
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - ./src:/app/src
    command: flask --app src.app run --host=0.0.0.0 --port=${APP_PORT} --debug
    restart: unless-stopped
